<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务网 · 入口</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body class="page-entry">
  <div class="wrap-narrow card">
    <div class="entry-head">
      <div class="logo">业</div>
      <h1>业务网</h1>
      <p>请选择您要进入的版本</p>
    </div>

    <div class="choices">
      <!-- 主推：全新版 -->
      <button class="choice choice-new" id="btnNew">
        <span class="ribbon">推荐</span>
        <div class="c-title">业务网 · 全新版</div>
        <div class="c-desc">更稳定、更省心，当前主推入口。</div>
        <div class="chips">
          <span class="chip">价格低</span>
          <span class="chip">稳定性好</span>
          <span class="chip">售后优质</span>
        </div>
      </button>

      <!-- 旧版 -->
      <button class="choice choice-old" id="btnOld">
        <span class="ribbon">不推荐</span>
        <div class="c-title">业务网 · 旧版</div>
        <div class="c-desc">即将下线，建议迁移至全新版。</div>
        <div class="chips">
          <span class="chip">稳定性低</span>
          <span class="chip">售后低</span>
        </div>
      </button>
    </div>

    <div class="foot">© 业务网 · 全新版为当前主推入口</div>
  </div>

  <script>
    document.getElementById('btnNew').addEventListener('click', () => {
      // 相对路径：兼容 GitHub Pages 项目页子路径
      window.location.href = 'app.html';
    });
    document.getElementById('btnOld').addEventListener('click', () => {
      // 新标签打开旧版站点（保留本站）
      window.open('https://mirabloom.chuangzaoba.top/', '_blank');
    });
  </script>
</body>
</html>
