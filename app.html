<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务网 · 全新版</title>
  <link rel="stylesheet" href="css/style.css?v=8" />
  <script src="config.js"></script>
</head>
<body>

  <!-- ============ 登录 ============ -->
  <div class="wrap-narrow card tight" id="loginBox">
    <div class="entry-head" style="margin-bottom:22px">
      <div class="logo">业</div>
      <h1>业务网 · 全新版</h1>
      <p>输入手机号登录，首次自动注册</p>
    </div>
    <div class="field">
      <label>手机号</label>
      <input id="loginPhone" inputmode="numeric" autocomplete="tel" placeholder="11 位手机号" />
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn">登录 / 注册</button>
    <div class="msg err" id="loginMsg"></div>
    <div class="foot"><a class="back-link" href="index.html">← 返回入口</a></div>
  </div>

  <!-- ============ 主界面 ============ -->
  <div class="wrap card" id="appBox" style="display:none">
    <div class="topbar">
      <div class="brandmark">
        <div class="logo">业</div>
        <div>
          <h1 class="title">业务网 · 全新版</h1>
          <div class="subtitle">我的 ID：<b id="myId">--</b></div>
        </div>
      </div>
      <div class="actions">
        <a class="back-link" href="index.html">← 返回入口</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
      </div>
    </div>

    <!-- 公告 -->
    <div class="ann-list" id="annList" style="display:none"></div>

    <!-- 账户条 -->
    <div class="points-bar">
      <div class="pb-left">
        <span class="pb-num" id="myPoints">0</span>
        <span class="pb-lbl">我的积分（≈ ¥<span id="pointsYuan">0</span>）</span>
      </div>
      <div class="pb-right">
        <span class="t-meta" id="streakTip"></span>
        <button class="btn btn-ghost btn-sm" id="checkinBtn">签到</button>
        <button class="btn btn-primary btn-sm" id="rechargeBtn">充值</button>
      </div>
    </div>

    <!-- 充值区 -->
    <div class="recharge-box" id="rechargeBox" style="display:none">
      <div class="section-title">账户充值</div>

      <div class="pay-steps">
        <div class="pay-step">
          <span class="step-no">1</span>
          <div class="step-body">
            <div class="step-title">用支付宝扫码付款</div>
            <div class="t-meta">长按下方二维码识别，或在支付宝里「扫一扫」扫码，付款金额填你要充的值。</div>
            <img class="qr-img" src="img/alipay-qr.jpg" alt="支付宝收款码" />
            <div class="t-meta">支持信用卡 / 花呗付款</div>
          </div>
        </div>

        <div class="pay-step">
          <span class="step-no">2</span>
          <div class="step-body">
            <div class="step-title">填付款信息并上传截图</div>
            <div class="row2">
              <div class="field">
                <label>充值金额 *</label>
                <input id="rcAmount" type="number" min="1" placeholder="如 10" />
              </div>
              <div class="field">
                <label>支付宝账号 / 昵称 *</label>
                <input id="rcAccount" placeholder="你付款用的支付宝账号或昵称" />
              </div>
            </div>
            <span class="t-meta" id="rcTip"></span>

            <div class="field" style="margin-top:10px">
              <label>付款成功截图 *</label>
              <div class="uploader">
                <input type="file" id="rcFile" accept="image/*" hidden />
                <button type="button" class="btn btn-ghost btn-sm" id="rcPickBtn">+ 上传截图</button>
                <span class="t-meta">转账成功页截图（能看到金额和付款时间）</span>
              </div>
              <div class="thumbs" id="rcThumb"></div>
            </div>

            <div class="actions" style="margin-top:12px">
              <button class="btn btn-primary btn-sm" id="rcSubmitBtn">我已付款，提交审核</button>
              <span class="msg ok" id="rcMsg"></span>
            </div>
            <div class="t-meta" style="margin-top:10px">
              提交后管理员核对截图，通过后自动到账，1 元 = <span id="ppY">100</span> 积分。
            </div>
          </div>
        </div>
      </div>

      <div class="sub-title" style="margin:18px 0 8px">我的充值记录</div>
      <div id="rcList" class="task-list"></div>
    </div>

    <div class="section-title">类型任务提交</div>
    <div class="row2">
      <div class="field">
        <label>任务类型 *</label>
        <input id="type" placeholder="例如：点赞 / 关注 / 数据标注" />
      </div>
      <div class="field">
        <label>联系方式 *</label>
        <input id="contact" placeholder="手机号 / 微信号" />
      </div>
    </div>
    <div class="quick" id="quickTypes"></div>

    <div class="row2">
      <div class="field">
        <label>预估费用</label>
        <div class="estimate pending" id="estimate">待评估</div>
      </div>
      <div class="field">
        <label>应付积分</label>
        <div class="estimate pending" id="needPoints">--</div>
      </div>
    </div>
    <div class="t-meta" id="payTip" style="margin: -6px 0 14px"></div>

    <div class="field">
      <label>任务描述（选填）</label>
      <textarea id="desc" placeholder="补充说明任务要求…"></textarea>
    </div>
    <div class="field">
      <label>任务图片（选填，最多 6 张）</label>
      <div class="uploader">
        <input type="file" id="imgInput" accept="image/*" multiple hidden />
        <button type="button" class="btn btn-ghost btn-sm" id="pickBtn">+ 选择图片</button>
        <span class="t-meta">支持 jpg / png / webp，单张不超过 5MB</span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="submitBtn">提交并支付</button>
      <span id="submitMsg" class="msg ok"></span>
    </div>

    <div class="section-title">我的任务 / 当前进度</div>
    <div id="taskList" class="task-list"><div class="loading">加载中…</div></div>
  </div>

  <script>
    const STATUS_TEXT = {
      pending_review: '待审核',
      approved: '已受理',
      completed: '已完成',
      rejected: '已拒绝（积分已退）'
    };

    const PHONE_KEY = 'biz_phone';
    let PHONE = localStorage.getItem(PHONE_KEY) || '';
    let RATES = [];
    let PTS = { points: 0, pointsPerYuan: 100, checkedToday: false, streak: 0, checkinPoints: 10 };
    let picked = [];                 // [{ file, url }]
    let rcPicked = null;             // 充值付款截图（单张 file）
    const signedCache = {};          // path -> { url, exp }

    function $(id) { return document.getElementById(id); }

    async function api(endpoint, body) {
      const r = await fetch(window.API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: endpoint, ...(body || {}) })
      });
      return r.json();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function fmtTime(s) { return s ? new Date(s).toLocaleString('zh-CN', { hour12: false }) : ''; }
    function moneyText(v) { return (v === null || v === undefined || v === '') ? '待评估' : ('¥' + Number(v)); }
    function intFmt(n) { return Number(n || 0).toLocaleString('en-US'); }

    // ==================== 登录 ====================
    $('loginBtn').addEventListener('click', doLogin);
    $('loginPhone').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const phone = $('loginPhone').value.trim();
      const msg = $('loginMsg');
      msg.textContent = '';
      if (!/^\d{6,15}$/.test(phone)) { msg.textContent = '请输入正确的手机号'; return; }
      const btn = $('loginBtn');
      btn.disabled = true;
      const res = await api('user/login', { phone });
      btn.disabled = false;
      if (!res.ok) { msg.textContent = res.msg || '登录失败'; return; }
      PHONE = res.phone;
      localStorage.setItem(PHONE_KEY, PHONE);
      startApp();
    }

    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem(PHONE_KEY);
      PHONE = '';
      $('appBox').style.display = 'none';
      $('loginBox').style.display = '';
      $('loginPhone').value = '';
    });

    function startApp() {
      $('loginBox').style.display = 'none';
      $('appBox').style.display = 'block';
      $('myId').textContent = PHONE;
      if (!$('contact').value) $('contact').value = PHONE;
      loadRates();
      loadPoints();
      loadAnnouncements();
      loadTasks();
      loadRecharges();
    }

    // ==================== 积分 / 签到 ====================
    async function loadPoints() {
      const res = await api('my/points', { phone: PHONE });
      if (!res.ok) return;
      PTS = res;
      $('myPoints').textContent = intFmt(res.points);
      $('pointsYuan').textContent = (res.points / (res.pointsPerYuan || 100)).toFixed(2);
      $('ppY').textContent = res.pointsPerYuan;
      const btn = $('checkinBtn');
      if (res.checkedToday) {
        btn.disabled = true;
        btn.textContent = '今日已签到';
        $('streakTip').textContent = res.streak > 1 ? ('连续签到 ' + res.streak + ' 天') : '';
      } else {
        btn.disabled = false;
        btn.textContent = '签到 +' + res.checkinPoints;
        $('streakTip').textContent = res.streak > 0 ? ('已连续 ' + res.streak + ' 天') : '';
      }
      renderPay();
    }

    $('checkinBtn').addEventListener('click', async () => {
      const btn = $('checkinBtn');
      btn.disabled = true;
      const res = await api('checkin', { phone: PHONE });
      if (res.ok) alert('签到成功，获得 ' + res.gain + ' 积分' + (res.streak > 1 ? '（连续 ' + res.streak + ' 天）' : ''));
      else alert(res.msg || '签到失败');
      loadPoints();
    });

    // ==================== 充值 ====================
    $('rechargeBtn').addEventListener('click', () => {
      const box = $('rechargeBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      if (box.style.display === 'block') loadRecharges();
    });

    $('rcAmount').addEventListener('input', () => {
      const a = Number($('rcAmount').value) || 0;
      $('rcTip').textContent = a > 0 ? ('将到账 ' + intFmt(Math.floor(a * (PTS.pointsPerYuan || 100))) + ' 积分') : '';
    });

    // 付款截图选图 / 移除
    $('rcPickBtn').addEventListener('click', () => $('rcFile').click());
    $('rcFile').addEventListener('change', () => {
      const f = $('rcFile').files && $('rcFile').files[0];
      if (!f) return;
      if (!f.type || f.type.indexOf('image/') !== 0) { alert('只能上传图片文件'); return; }
      if (f.size > (window.MAX_IMAGE_MB || 5) * 1024 * 1024) { alert('图片超过 5MB，请压缩后再传'); return; }
      rcPicked = f;
      const url = URL.createObjectURL(f);
      $('rcThumb').innerHTML = '<div class="thumb"><img src="' + url + '" alt="" /><button type="button" class="thumb-del" title="移除" onclick="removeRcProof()">×</button></div>';
    });
    function removeRcProof() {
      rcPicked = null;
      $('rcFile').value = '';
      $('rcThumb').innerHTML = '';
    }

    $('rcSubmitBtn').addEventListener('click', async () => {
      const amount = Number($('rcAmount').value);
      const account = $('rcAccount').value.trim();
      const msg = $('rcMsg');
      msg.className = 'msg ok'; msg.textContent = '';
      if (!amount || amount <= 0) { msg.className = 'msg err'; msg.textContent = '请输入充值金额'; return; }
      if (!account) { msg.className = 'msg err'; msg.textContent = '请填写付款的支付宝账号或昵称'; return; }
      if (!rcPicked) { msg.className = 'msg err'; msg.textContent = '请上传付款成功截图'; return; }

      const btn = $('rcSubmitBtn');
      btn.disabled = true;
      try {
        msg.className = 'msg ok'; msg.textContent = '正在上传截图…';
        const proof = await uploadFile(rcPicked, 'recharge');
        msg.textContent = '正在提交…';
        const res = await api('recharge/submit', { phone: PHONE, amount, payAccount: account, proof });
        if (!res.ok) { msg.className = 'msg err'; msg.textContent = res.msg || '提交失败'; btn.disabled = false; return; }
        msg.textContent = '已提交，等待管理员核对截图后到账';
        $('rcAmount').value = ''; $('rcAccount').value = '';
        $('rcTip').textContent = '';
        removeRcProof();
        loadRecharges();
      } catch (e) {
        msg.className = 'msg err'; msg.textContent = e.message || '提交失败';
      }
      btn.disabled = false;
    });

    const RC_STATUS = { pending: '待核对', approved: '已到账', rejected: '已拒绝' };
    async function loadRecharges() {
      const box = $('rcList');
      const res = await api('recharge/list', { phone: PHONE });
      if (!res.ok) { box.innerHTML = ''; return; }
      const list = res.recharges || [];
      if (!list.length) { box.innerHTML = '<div class="empty">还没有充值记录</div>'; return; }
      await ensureSignedPaths(list.map(r => r.proof).filter(Boolean));
      box.innerHTML = list.map(r => {
        const badge = '<span class="badge b-' + (r.status === 'approved' ? 'completed' : r.status === 'rejected' ? 'rejected' : 'pending_review') + '">' + (RC_STATUS[r.status] || r.status) + '</span>';
        const proofHtml = r.proof
          ? (() => {
              const u = signedUrl(r.proof);
              return u
                ? '<a class="thumb" href="' + escapeHtml(u) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(u) + '" alt="付款截图" /></a>'
                : '<div class="thumb thumb-wait"></div>';
            })()
          : '<span class="t-meta">未上传截图</span>';
        return '<div class="task">' +
          '<div class="t-head">' + badge + '<span class="t-meta">' + fmtTime(r.created_at) + '</span></div>' +
          '<div class="t-type">充值 ¥' + Number(r.amount) + ' → ' + intFmt(r.points) + ' 积分</div>' +
          (r.pay_account ? '<div class="t-meta">付款账号：' + escapeHtml(r.pay_account) + '</div>' : '') +
          (r.proof ? '<div class="thumbs">' + proofHtml + '</div>' : '<div>' + proofHtml + '</div>') +
          (r.note ? '<div class="t-meta">管理员备注：' + escapeHtml(r.note) + '</div>' : '') +
        '</div>';
      }).join('');
    }

    // ==================== 公告 ====================
    async function loadAnnouncements() {
      const res = await api('announcement/list', {});
      const box = $('annList');
      const list = (res.ok && res.announcements) ? res.announcements : [];
      if (!list.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
      box.style.display = '';
      box.innerHTML = list.slice(0, 3).map(a =>
        '<div class="ann">' +
          '<div class="ann-title"><span class="ann-tag">公告</span>' + escapeHtml(a.title || '平台公告') + '</div>' +
          (a.content ? '<div class="ann-body">' + escapeHtml(a.content).replace(/\n/g, '<br />') + '</div>' : '') +
        '</div>'
      ).join('');
    }

    // ==================== 关键词 / 预估 ====================
    async function loadRates() {
      const res = await api('rate/list', {});
      if (!res.ok) return;
      RATES = res.rates || [];
      renderQuick();
      renderEstimate();
    }

    function renderQuick() {
      const box = $('quickTypes');
      if (!RATES.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<span class="q-lbl">常用：</span>' + RATES.slice(0, 12).map(r =>
        '<button type="button" class="q-chip" data-kw="' + escapeHtml(r.keyword) + '">' +
        escapeHtml(r.keyword) + ' <i>¥' + Number(r.amount) + '</i></button>'
      ).join('');
      box.querySelectorAll('.q-chip').forEach(b => {
        b.addEventListener('click', () => {
          $('type').value = b.dataset.kw;
          renderEstimate();
        });
      });
    }

    function estimateLocal(type) {
      const t = String(type || '').toLowerCase().trim();
      if (!t) return null;
      let best = null;
      for (const r of RATES) {
        const k = String(r.keyword || '').toLowerCase().trim();
        if (!k || t.indexOf(k) === -1) continue;
        if (!best || k.length > best.len) best = { len: k.length, amount: Number(r.amount) };
      }
      return best ? best.amount : null;
    }

    function renderEstimate() {
      const el = $('estimate');
      const v = estimateLocal($('type').value);
      if (v === null) {
        el.className = 'estimate pending';
        el.textContent = '待评估';
      } else {
        el.className = 'estimate';
        el.textContent = '¥' + v;
      }
      renderPay();
    }

    function renderPay() {
      const v = estimateLocal($('type').value);
      const need = $('needPoints');
      const tip = $('payTip');
      if (v === null) {
        need.className = 'estimate pending';
        need.textContent = '--';
        tip.textContent = '该类型暂无报价，无法提交。换个类型或联系客服。';
        tip.className = 't-meta';
        return;
      }
      const p = Math.floor(v * (PTS.pointsPerYuan || 100));
      need.className = 'estimate';
      need.textContent = intFmt(p) + ' 积分';
      const bal = Number(PTS.points) || 0;
      if (bal >= p) {
        tip.textContent = '余额 ' + intFmt(bal) + ' 积分，支付后剩余 ' + intFmt(bal - p) + ' 积分';
        tip.className = 't-meta';
      } else {
        tip.textContent = '余额不足：还差 ' + intFmt(p - bal) + ' 积分，请先充值';
        tip.className = 't-meta';
        tip.style.color = 'var(--danger)';
      }
      if (bal >= p) tip.style.color = '';
    }

    $('type').addEventListener('input', renderEstimate);

    // ==================== 图片 ====================
    const MAX_IMAGES = window.MAX_IMAGES || 6;
    const MAX_IMAGE_MB = window.MAX_IMAGE_MB || 5;

    $('pickBtn').addEventListener('click', () => $('imgInput').click());

    $('imgInput').addEventListener('change', () => {
      const files = Array.from($('imgInput').files || []);
      for (const f of files) {
        if (picked.length >= MAX_IMAGES) { alert('最多上传 ' + MAX_IMAGES + ' 张图片'); break; }
        if (!f.type || f.type.indexOf('image/') !== 0) { alert('只能上传图片文件'); continue; }
        if (f.size > MAX_IMAGE_MB * 1024 * 1024) { alert('「' + f.name + '」超过 ' + MAX_IMAGE_MB + 'MB，已跳过'); continue; }
        picked.push({ file: f, url: URL.createObjectURL(f) });
      }
      $('imgInput').value = '';
      renderThumbs();
    });

    function renderThumbs() {
      $('thumbs').innerHTML = picked.map((p, i) =>
        '<div class="thumb"><img src="' + p.url + '" alt="" />' +
        '<button type="button" class="thumb-del" title="移除" onclick="removeImg(' + i + ')">×</button></div>'
      ).join('');
    }
    function removeImg(i) {
      if (picked[i]) { URL.revokeObjectURL(picked[i].url); picked.splice(i, 1); }
      renderThumbs();
    }
    function clearPicked() {
      picked.forEach(p => URL.revokeObjectURL(p.url));
      picked = [];
      renderThumbs();
    }

    async function uploadFile(file, tag) {
      let ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!ext) ext = 'jpg';
      const path = PHONE + '/' + tag + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) + '.' + ext;
      const r = await fetch(window.SUPABASE_URL + '/storage/v1/object/' + window.UPLOAD_BUCKET + '/' + path, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
          'apikey': window.SUPABASE_ANON_KEY,
          'Content-Type': file.type || 'image/jpeg',
          'x-upsert': 'false'
        },
        body: file
      });
      if (!r.ok) {
        let detail = '';
        try { detail = (await r.text()).slice(0, 140); } catch (e) {}
        throw new Error('图片上传失败（' + r.status + '）' + (detail ? '：' + detail : ''));
      }
      const j = await r.json().catch(() => ({}));
      const key = (j && j.Key) ? String(j.Key) : '';
      const rel = key.indexOf('biz-uploads/') === 0 ? key.slice('biz-uploads/'.length) : '';
      if (!rel) throw new Error('图片上传返回异常，请重试');
      return rel;
    }

    async function uploadImages() {
      const urls = [];
      for (let i = 0; i < picked.length; i++) {
        urls.push(await uploadFile(picked[i].file, 'task' + i));
      }
      return urls;
    }

    // ==================== 提交任务 ====================
    $('submitBtn').addEventListener('click', async () => {
      const type = $('type').value.trim();
      const desc = $('desc').value.trim();
      const contact = $('contact').value.trim();
      const msg = $('submitMsg');
      msg.className = 'msg ok'; msg.textContent = '';
      if (!type) { msg.className = 'msg err'; msg.textContent = '请填写任务类型'; return; }
      if (!contact) { msg.className = 'msg err'; msg.textContent = '请填写联系方式'; return; }

      const v = estimateLocal(type);
      if (v === null) { msg.className = 'msg err'; msg.textContent = '该任务类型暂无报价，请换一个类型'; return; }
      const need = Math.floor(v * (PTS.pointsPerYuan || 100));
      if ((Number(PTS.points) || 0) < need) {
        $('rechargeBox').style.display = 'block';
        loadRecharges();
        msg.className = 'msg err';
        msg.textContent = '积分不足（需 ' + intFmt(need) + '），请先充值';
        return;
      }

      const btn = $('submitBtn');
      btn.disabled = true;

      let images = [];
      if (picked.length) {
        msg.className = 'msg ok';
        msg.textContent = '正在上传图片…';
        try {
          images = await uploadImages();
        } catch (e) {
          msg.className = 'msg err'; msg.textContent = e.message || '图片上传失败';
          btn.disabled = false;
          return;
        }
      }

      msg.className = 'msg ok';
      msg.textContent = '正在提交…';
      const res = await api('task/submit', { phone: PHONE, type, desc, contact, images });
      btn.disabled = false;
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = '提交成功，已扣 ' + intFmt(res.task.points_paid) + ' 积分（' + res.task.id + '）';
        $('type').value = '';
        $('desc').value = '';
        clearPicked();
        renderEstimate();
        loadPoints();
        loadTasks();
      } else {
        msg.className = 'msg err'; msg.textContent = res.msg || '提交失败';
        if (res.code === 'INSUFFICIENT_POINTS') {
          $('rechargeBox').style.display = 'block';
          loadRecharges();
        }
      }
    });

    // ==================== 我的任务 ====================
    function badge(status) {
      return '<span class="badge b-' + status + '">' + (STATUS_TEXT[status] || status) + '</span>';
    }

    function signedUrl(p) {
      const c = signedCache[p];
      return (c && c.exp > Date.now()) ? c.url : '';
    }

    async function ensureSignedPaths(paths) {
      const need = (paths || []).filter(p => {
        const c = signedCache[p];
        return !c || c.exp < Date.now() + 60000;
      });
      const uniq = Array.from(new Set(need));
      if (!uniq.length) return;
      const res = await api('image/sign', { phone: PHONE, paths: uniq });
      if (res.ok && res.urls) {
        Object.keys(res.urls).forEach(p => {
          signedCache[p] = { url: res.urls[p], exp: Date.now() + 50 * 60 * 1000 };
        });
      }
    }

    function renderTasks(tasks) {
      const box = $('taskList');
      if (!tasks.length) {
        box.innerHTML = '<div class="empty">暂无任务，提交后将在此显示进度</div>';
        return;
      }
      box.innerHTML = tasks.map(t => {
        const note = t.progress_note ? '<div class="note">管理员备注：' + escapeHtml(t.progress_note) + '</div>' : '';
        const imgs = Array.isArray(t.images) ? t.images : [];
        const imgHtml = imgs.length
          ? '<div class="thumbs">' + imgs.map(p => {
              const u = signedUrl(p);
              return u
                ? '<a class="thumb" href="' + escapeHtml(u) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(u) + '" alt="" /></a>'
                : '<div class="thumb thumb-wait"></div>';
            }).join('') + '</div>'
          : '';
        return '<div class="task">' +
          '<div class="t-head">' + badge(t.status) + '<span class="t-meta">' + t.id + '</span></div>' +
          '<div class="t-type">' + escapeHtml(t.type) + '</div>' +
          (t.description ? '<div class="t-desc">' + escapeHtml(t.description) + '</div>' : '') +
          imgHtml +
          '<div class="t-meta">费用：' + moneyText(t.amount) + ' ｜ 已付：' + intFmt(t.points_paid) + ' 积分 ｜ ' + fmtTime(t.created_at) + '</div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + (t.progress || 0) + '%"></div></div>' +
          note +
          '</div>';
      }).join('');
    }

    async function loadTasks() {
      const res = await api('tasks', { phone: PHONE });
      if (res.ok) {
        const paths = [];
        (res.tasks || []).forEach(t => (Array.isArray(t.images) ? t.images : []).forEach(p => paths.push(p)));
        await ensureSignedPaths(paths);
        renderTasks(res.tasks);
      } else {
        $('taskList').innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    // ==================== 启动 ====================
    if (PHONE) startApp();
    setInterval(() => { if (PHONE) loadTasks(); }, 8000);
  </script>
</body>
</html>
