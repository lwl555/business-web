<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务网 · 全新版</title>
  <link rel="stylesheet" href="css/style.css?v=6" />
  <script src="config.js"></script>
</head>
<body>
  <div class="wrap card">
    <div class="topbar">
      <div class="brandmark">
        <div class="logo">业</div>
        <div>
          <h1 class="title">业务网 · 全新版</h1>
          <div class="subtitle">商品与服务 · 任务中心</div>
        </div>
      </div>
      <a class="back-link" href="index.html">← 返回入口</a>
    </div>

    <!-- 签到 / 积分 -->
    <div class="points-bar">
      <div class="pb-left">
        <span class="pb-num" id="myPoints">--</span>
        <span class="pb-lbl">我的积分</span>
      </div>
      <div class="pb-right">
        <span class="t-meta" id="streakTip"></span>
        <button class="btn btn-primary btn-sm" id="checkinBtn">签到</button>
      </div>
    </div>

    <div class="section-title">类型任务提交</div>
    <div class="row2">
      <div class="field">
        <label>任务类型 *</label>
        <input id="type" placeholder="例如：数据标注 / 文案撰写 / 设计稿" />
      </div>
      <div class="field">
        <label>联系方式 *</label>
        <input id="contact" placeholder="手机号 / 微信号" />
      </div>
    </div>
    <div class="quick" id="quickTypes"></div>
    <div class="field">
      <label>预估资金</label>
      <div class="estimate pending" id="estimate">待评估</div>
    </div>
    <div class="field" id="deductWrap" style="display:none">
      <label class="chk">
        <input type="checkbox" id="usePoints" />
        <span>使用积分抵扣（我有 <b id="ptsHave">0</b> 积分，这一单最多可抵 <b id="maxDeduct">¥0</b>）</span>
      </label>
      <div class="t-meta" id="payTip"></div>
    </div>
    <div class="field">
      <label>任务描述（选填）</label>
      <textarea id="desc" placeholder="补充说明任务要求…"></textarea>
    </div>
    <div class="field">
      <label>任务图片（选填，最多 6 张）</label>
      <div class="uploader">
        <input type="file" id="imgInput" accept="image/*" multiple hidden />
        <button type="button" class="btn btn-ghost btn-sm" id="pickBtn">+ 选择图片</button>
        <span class="t-meta">支持 jpg / png / webp，单张不超过 5MB</span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="submitBtn">提交任务</button>
      <span id="submitMsg" class="msg ok"></span>
    </div>

    <div class="section-title">我的任务 / 当前进度</div>
    <div id="taskList" class="task-list"><div class="loading">加载中…</div></div>
  </div>

  <script>
    const STATUS_TEXT = {
      pending_review: '待审核',
      approved: '已通过 · 待充值',
      recharge_pending: '已充值 · 待确认',
      completed: '已完成',
      rejected: '已拒绝'
    };

    function getUid() {
      let uid = localStorage.getItem('biz_uid');
      if (!uid) {
        uid = 'U-' + Math.random().toString(36).slice(2, 10).toUpperCase();
        localStorage.setItem('biz_uid', uid);
      }
      return uid;
    }
    const uid = getUid();

    // 关键词金额规则（由后台维护），用于本页实时预估
    let RATES = [];

    async function api(endpoint, body) {
      const r = await fetch(window.API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: endpoint, ...(body || {}) })
      });
      return r.json();
    }

    // 与后端同一套规则：任务类型包含某关键词即命中，多个命中取最长的那个
    function estimateLocal(type) {
      const t = String(type || '').toLowerCase().trim();
      if (!t) return null;
      let best = null;
      for (const r of RATES) {
        const k = String(r.keyword || '').toLowerCase().trim();
        if (!k || t.indexOf(k) === -1) continue;
        if (!best || k.length > best.len) best = { len: k.length, amount: Number(r.amount) };
      }
      return best ? best.amount : null;
    }

    function renderEstimate() {
      const el = document.getElementById('estimate');
      const v = estimateLocal(document.getElementById('type').value);
      if (v === null) {
        el.className = 'estimate pending';
        el.textContent = '待评估';
      } else {
        el.className = 'estimate';
        el.textContent = '¥' + v;
      }
    }

    function moneyText(v) {
      return (v === null || v === undefined || v === '') ? '待评估' : ('¥' + Number(v));
    }

    function moneyExtra(t) {
      const d = Number(t.deduction || 0);
      const p = Number(t.points_used || 0);
      if (!d && !p) return '';
      const pay = (t.amount === null || t.amount === undefined) ? null : Math.round((Number(t.amount) - d) * 100) / 100;
      return ' ｜ 积分抵扣：-' + d + '（' + p + ' 分）' + (pay === null ? '' : ' ｜ 实付：¥' + pay);
    }

    document.getElementById('type').addEventListener('input', () => { renderEstimate(); renderDeduct(); });

    async function loadRates() {
      const res = await api('rate/list', {});
      if (res.ok) {
        RATES = res.rates || [];
        renderEstimate();
        renderQuick();
        renderDeduct();
      }
    }

    // ---------- 常用任务类型快捷选择 ----------
    function renderQuick() {
      const box = document.getElementById('quickTypes');
      if (!RATES.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<span class="q-lbl">常用：</span>' + RATES.slice(0, 12).map(r =>
        '<button type="button" class="q-chip" data-kw="' + escapeHtml(r.keyword) + '">' +
        escapeHtml(r.keyword) + ' <i>¥' + Number(r.amount) + '</i></button>'
      ).join('');
      box.querySelectorAll('.q-chip').forEach(b => {
        b.addEventListener('click', () => {
          document.getElementById('type').value = b.dataset.kw;
          renderEstimate();
          renderDeduct();
        });
      });
    }

    // ---------- 签到 / 积分 ----------
    let PTS = { points: 0, checkedToday: false, streak: 0, checkinPoints: 10, pointsPerYuan: 100, maxDeductRatio: 0.5 };

    async function loadPoints() {
      const res = await api('my/points', { uid });
      if (!res.ok) return;
      PTS = res;
      document.getElementById('myPoints').textContent = res.points;
      const btn = document.getElementById('checkinBtn');
      if (res.checkedToday) {
        btn.disabled = true;
        btn.textContent = '今日已签到';
        document.getElementById('streakTip').textContent = res.streak > 1 ? ('连续签到 ' + res.streak + ' 天') : '';
      } else {
        btn.disabled = false;
        btn.textContent = '签到 +' + res.checkinPoints;
        document.getElementById('streakTip').textContent = res.streak > 0 ? ('已连续 ' + res.streak + ' 天') : '';
      }
      renderDeduct();
    }

    document.getElementById('checkinBtn').addEventListener('click', async () => {
      const btn = document.getElementById('checkinBtn');
      btn.disabled = true;
      const res = await api('checkin', { uid });
      if (res.ok) {
        alert('签到成功，获得 ' + res.gain + ' 积分' + (res.streak > 1 ? '（连续 ' + res.streak + ' 天）' : ''));
      } else {
        alert(res.msg || '签到失败');
      }
      loadPoints();
    });

    // 这一单最多能用多少积分 / 能抵多少钱
    function maxDeductInfo() {
      const amount = estimateLocal(document.getElementById('type').value);
      if (amount === null) return null;
      const maxPts = Math.floor(amount * PTS.maxDeductRatio * PTS.pointsPerYuan);
      const pts = Math.max(0, Math.min(Number(PTS.points) || 0, maxPts));
      const yuan = Math.round((pts / PTS.pointsPerYuan) * 100) / 100;
      return { amount: amount, points: pts, yuan: yuan, pay: Math.round((amount - yuan) * 100) / 100 };
    }

    function renderDeduct() {
      const wrap = document.getElementById('deductWrap');
      const info = maxDeductInfo();
      if (!info || info.points <= 0) {
        wrap.style.display = 'none';
        document.getElementById('usePoints').checked = false;
        document.getElementById('payTip').textContent = '';
        return;
      }
      wrap.style.display = '';
      document.getElementById('ptsHave').textContent = PTS.points;
      document.getElementById('maxDeduct').textContent = '¥' + info.yuan;
      const on = document.getElementById('usePoints').checked;
      document.getElementById('payTip').textContent = on
        ? ('抵扣 ' + info.points + ' 积分，减 ¥' + info.yuan + '，实付 ¥' + info.pay)
        : ('勾选后：抵扣 ' + info.points + ' 积分，实付 ¥' + info.pay);
    }

    document.getElementById('usePoints').addEventListener('change', renderDeduct);

    const CONTACT_KEY = 'biz_contact';
    const contactInput = document.getElementById('contact');
    contactInput.value = localStorage.getItem(CONTACT_KEY) || '';   // 记住上次填的，省得每次重填

    // ---------- 图片选择 / 预览 / 上传 ----------
    const MAX_IMAGES = window.MAX_IMAGES || 6;
    const MAX_IMAGE_MB = window.MAX_IMAGE_MB || 5;
    const imgInput = document.getElementById('imgInput');
    let picked = [];                 // [{ file, url }]

    document.getElementById('pickBtn').addEventListener('click', () => imgInput.click());

    imgInput.addEventListener('change', () => {
      const files = Array.from(imgInput.files || []);
      for (const f of files) {
        if (picked.length >= MAX_IMAGES) { alert('最多上传 ' + MAX_IMAGES + ' 张图片'); break; }
        if (!f.type || f.type.indexOf('image/') !== 0) { alert('只能上传图片文件'); continue; }
        if (f.size > MAX_IMAGE_MB * 1024 * 1024) { alert('「' + f.name + '」超过 ' + MAX_IMAGE_MB + 'MB，已跳过'); continue; }
        picked.push({ file: f, url: URL.createObjectURL(f) });
      }
      imgInput.value = '';
      renderThumbs();
    });

    function renderThumbs() {
      document.getElementById('thumbs').innerHTML = picked.map((p, i) =>
        '<div class="thumb"><img src="' + p.url + '" alt="" />' +
        '<button type="button" class="thumb-del" title="移除" onclick="removeImg(' + i + ')">×</button></div>'
      ).join('');
    }

    function removeImg(i) {
      if (picked[i]) { URL.revokeObjectURL(picked[i].url); picked.splice(i, 1); }
      renderThumbs();
    }

    function clearPicked() {
      picked.forEach(p => URL.revokeObjectURL(p.url));
      picked = [];
      renderThumbs();
    }

    // 逐张上传到 Supabase Storage，返回公开访问 URL 数组
    async function uploadImages(u) {
      const urls = [];
      for (let i = 0; i < picked.length; i++) {
        const p = picked[i];
        let ext = (p.file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!ext) ext = 'jpg';
        const path = u + '/' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 6) + '.' + ext;
        const r = await fetch(window.SUPABASE_URL + '/storage/v1/object/' + window.UPLOAD_BUCKET + '/' + path, {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
            'apikey': window.SUPABASE_ANON_KEY,
            'Content-Type': p.file.type || 'image/jpeg',
            'x-upsert': 'false'
          },
          body: p.file
        });
        if (!r.ok) {
          let detail = '';
          try { detail = (await r.text()).slice(0, 140); } catch (e) {}
          throw new Error('图片上传失败（' + r.status + '）' + (detail ? '：' + detail : ''));
        }
        // 桶已私有：只存相对 path，展示时再向后端换临时链接
        const j = await r.json().catch(() => ({}));
        const key = (j && j.Key) ? String(j.Key) : '';
        const path = key.indexOf('biz-uploads/') === 0 ? key.slice('biz-uploads/'.length) : '';
        if (!path) throw new Error('图片上传返回异常，请重试');
        urls.push(path);
      }
      return urls;
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const type = document.getElementById('type').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const contact = contactInput.value.trim();
      const msg = document.getElementById('submitMsg');
      msg.className = 'msg ok'; msg.textContent = '';
      if (!type) { msg.className = 'msg err'; msg.textContent = '请填写任务类型'; return; }
      if (!contact) { msg.className = 'msg err'; msg.textContent = '请填写联系方式'; return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      let images = [];
      if (picked.length) {
        msg.className = 'msg ok';
        msg.textContent = '正在上传图片（0/' + picked.length + '）…';
        try {
          images = await uploadImages(uid);
        } catch (e) {
          msg.className = 'msg err'; msg.textContent = e.message || '图片上传失败';
          btn.disabled = false;
          return;
        }
      }

      msg.className = 'msg ok';
      msg.textContent = '正在提交…';
      const usePoints = document.getElementById('usePoints').checked;
      const res = await api('task/submit', { uid, type, desc, contact, images, usePoints });
      btn.disabled = false;
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = '提交成功，等待管理员审核（' + res.task.id + '）';
        localStorage.setItem(CONTACT_KEY, contact);
        document.getElementById('type').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('usePoints').checked = false;
        clearPicked();
        renderEstimate();
        renderDeduct();
        loadPoints();
        loadTasks();
      } else {
        msg.className = 'msg err'; msg.textContent = res.msg || '提交失败';
      }
    });

    // ---------- 私有图片：按需换取临时链接并缓存（避免轮询时反复重载） ----------
    const signedCache = {};                 // path -> { url, exp }

    function signedUrl(p) {
      const c = signedCache[p];
      return (c && c.exp > Date.now()) ? c.url : '';
    }

    async function ensureSigned(tasks) {
      const need = [];
      (tasks || []).forEach(t => {
        (Array.isArray(t.images) ? t.images : []).forEach(p => {
          const c = signedCache[p];
          if (!c || c.exp < Date.now() + 60000) need.push(p);
        });
      });
      const uniq = Array.from(new Set(need));
      if (!uniq.length) return;
      const res = await api('image/sign', { uid, paths: uniq });
      if (res.ok && res.urls) {
        Object.keys(res.urls).forEach(p => {
          signedCache[p] = { url: res.urls[p], exp: Date.now() + 50 * 60 * 1000 };
        });
      }
    }

    function badge(status) {
      return '<span class="badge b-' + status + '">' + (STATUS_TEXT[status] || status) + '</span>';
    }

    function renderTasks(tasks) {
      const box = document.getElementById('taskList');
      if (!tasks.length) {
        box.innerHTML = '<div class="empty">暂无任务，提交后将在此显示进度</div>';
        return;
      }
      box.innerHTML = tasks.map(t => {
        const canRecharge = t.status === 'approved';
        const rechargeBtn = canRecharge
          ? '<button class="btn btn-green btn-sm" onclick="markRecharge(\'' + t.id + '\')">我已充值</button>'
          : '';
        const note = t.progress_note ? '<div class="note">管理员备注：' + escapeHtml(t.progress_note) + '</div>' : '';
        const imgs = Array.isArray(t.images) ? t.images : [];
        const imgHtml = imgs.length
          ? '<div class="thumbs">' + imgs.map(p => {
              const u = signedUrl(p);
              return u
                ? '<a class="thumb" href="' + escapeHtml(u) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(u) + '" alt="" /></a>'
                : '<div class="thumb thumb-wait"></div>';
            }).join('') + '</div>'
          : '';
        return '<div class="task">' +
          '<div class="t-head">' + badge(t.status) + '<span class="t-meta">' + t.id + '</span></div>' +
          '<div class="t-type">' + escapeHtml(t.type) + '</div>' +
          (t.description ? '<div class="t-desc">' + escapeHtml(t.description) + '</div>' : '') +
          imgHtml +
          '<div class="t-meta">预估资金：' + moneyText(t.amount) + moneyExtra(t) + ' ｜ 提交：' + fmtTime(t.created_at) + '</div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + (t.progress || 0) + '%"></div></div>' +
          note +
          (rechargeBtn ? '<div class="actions">' + rechargeBtn + '</div>' : '') +
          '</div>';
      }).join('');
    }

    async function markRecharge(id) {
      if (!confirm('确认已向平台完成资金充值？提交后等待管理员二审确认。')) return;
      const res = await api('task/recharge', { id, uid });
      if (res.ok) loadTasks(); else alert(res.msg || '操作失败');
    }

    async function loadTasks() {
      const res = await api('tasks', { uid });
      if (res.ok) {
        await ensureSigned(res.tasks);
        renderTasks(res.tasks);
      } else {
        document.getElementById('taskList').innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function fmtTime(s) {
      return s ? new Date(s).toLocaleString('zh-CN', { hour12: false }) : '';
    }

    loadRates();
    loadPoints();
    loadTasks();
    setInterval(loadTasks, 8000);
  </script>
</body>
</html>
