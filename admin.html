<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务网 · 管理后台</title>
  <link rel="stylesheet" href="css/style.css?v=6" />
  <script src="config.js"></script>
</head>
<body>
  <!-- 登录 -->
  <div class="wrap-narrow card tight" id="loginBox">
    <div style="text-align:center; margin-bottom: 22px;">
      <div class="logo" style="margin:0 auto 14px;">管</div>
      <h1 class="title">管理员登录</h1>
      <div class="subtitle">业务网 · 审核后台</div>
    </div>
    <div class="field">
      <label>账号</label>
      <input id="username" value="18882632073" placeholder="手机号" />
    </div>
    <div class="field">
      <label>密码</label>
      <div class="pwd">
        <input id="password" type="password" placeholder="******" />
        <button type="button" id="pwdToggle" class="pwd-toggle">显示</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn">登录</button>
    <div id="loginMsg" class="msg err"></div>
    <div class="foot"><a class="back-link" href="index.html">← 返回入口</a></div>
  </div>

  <!-- 后台 -->
  <div class="wrap card" id="dash" style="display:none">
    <div class="topbar">
      <div class="brandmark">
        <div class="logo">管</div>
        <div>
          <h1 class="title">审核后台</h1>
          <div class="subtitle">当前登录：<span id="who"></span></div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tabs">
      <div class="tab active" data-tab="review">一审 · 待审核</div>
      <div class="tab" data-tab="recharge">二审 · 待确认</div>
      <div class="tab" data-tab="all">全部任务</div>
      <div class="tab" data-tab="rates">金额规则</div>
    </div>

    <div id="list" class="task-list"><div class="loading">加载中…</div></div>

    <div id="ratePanel" style="display:none">
      <div class="section-title">积分设置</div>
      <div class="rate-add">
        <label class="inline-field">每天签到得
          <input id="setCheckin" class="num" type="number" min="0" />
          <span>积分</span>
        </label>
        <label class="inline-field">
          <input id="setPerYuan" class="num" type="number" min="1" />
          <span>积分抵 1 元</span>
        </label>
        <label class="inline-field">最高抵扣
          <input id="setRatio" class="num" type="number" min="0" max="100" />
          <span>%</span>
        </label>
        <button class="btn btn-primary btn-sm" id="saveSettingsBtn">保存</button>
        <span class="msg ok" id="setMsg"></span>
      </div>

      <div class="section-title">关键词金额规则</div>
      <div class="rate-add">
        <input id="newKw" class="grow" placeholder="关键词，如：数据标注" />
        <input id="newAmt" class="num" type="number" min="0" placeholder="金额（元）" />
        <button class="btn btn-primary btn-sm" id="addRateBtn">添加规则</button>
      </div>
      <div class="subtitle" style="margin-bottom:14px">
        任务类型里含该关键词时，自动按此金额预估；多个关键词命中时取最长的那个。用户端实时显示的就是这里的价格。
      </div>
      <div id="rateList" class="task-list"><div class="loading">加载中…</div></div>
    </div>
  </div>

  <script>
    const STATUS_TEXT = {
      pending_review: '待审核',
      approved: '已通过 · 待充值',
      recharge_pending: '已充值 · 待确认',
      completed: '已完成',
      rejected: '已拒绝'
    };
    let token = localStorage.getItem('biz_admin_token') || '';
    let currentTab = 'review';

    async function api(endpoint, body, needToken) {
      const payload = Object.assign({}, body || {});
      if (needToken && token) payload.token = token;
      const r = await fetch(window.API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint: endpoint, ...payload })
      });
      return r.json();
    }

    // ---------- 私有图片：按需换取临时链接并缓存 ----------
    const signedCache = {};                 // path -> { url, exp }
    function signedUrl(p) {
      const c = signedCache[p];
      return (c && c.exp > Date.now()) ? c.url : '';
    }
    async function ensureSigned(tasks) {
      const need = [];
      (tasks || []).forEach(t => {
        (Array.isArray(t.images) ? t.images : []).forEach(p => {
          const c = signedCache[p];
          if (!c || c.exp < Date.now() + 60000) need.push(p);
        });
      });
      const uniq = Array.from(new Set(need));
      if (!uniq.length) return;
      const res = await api('image/sign', { paths: uniq }, true);
      if (res.ok && res.urls) {
        Object.keys(res.urls).forEach(p => {
          signedCache[p] = { url: res.urls[p], exp: Date.now() + 50 * 60 * 1000 };
        });
      }
    }

    function badge(status) {
      return '<span class="badge b-' + status + '">' + (STATUS_TEXT[status] || status) + '</span>';
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function fmtTime(s) { return s ? new Date(s).toLocaleString('zh-CN', { hour12: false }) : ''; }
    function moneyText(v) { return (v === null || v === undefined || v === '') ? '待评估' : ('¥' + Number(v)); }
    function moneyExtra(t) {
      const d = Number(t.deduction || 0);
      const p = Number(t.points_used || 0);
      if (!d && !p) return '';
      const pay = (t.amount === null || t.amount === undefined) ? null : Math.round((Number(t.amount) - d) * 100) / 100;
      return ' ｜ 积分抵扣：-' + d + '（' + p + ' 分）' + (pay === null ? '' : ' ｜ 实付：¥' + pay);
    }

    document.getElementById('pwdToggle').addEventListener('click', () => {
      const el = document.getElementById('password');
      const show = el.type === 'password';
      el.type = show ? 'text' : 'password';
      document.getElementById('pwdToggle').textContent = show ? '隐藏' : '显示';
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const msg = document.getElementById('loginMsg');
      msg.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const res = await api('login', { username, password });
      if (res.ok) {
        token = res.token;
        localStorage.setItem('biz_admin_token', token);
        showDash(res.username);
      } else {
        msg.textContent = res.msg || '登录失败';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      token = ''; localStorage.removeItem('biz_admin_token');
      document.getElementById('dash').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    });

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        currentTab = t.dataset.tab;
        if (currentTab === 'rates') showRatePanel();
        else { hideRatePanel(); loadTasks(); }
      });
    });

    function showRatePanel() {
      document.getElementById('list').style.display = 'none';
      document.getElementById('ratePanel').style.display = 'block';
      loadRates();
      loadSettings();
    }

    // ---------- 积分设置 ----------
    async function loadSettings() {
      const res = await api('admin/settings', {}, true);
      if (!res.ok) return;
      const s = res.settings;
      document.getElementById('setCheckin').value = s.checkin_points;
      document.getElementById('setPerYuan').value = s.points_per_yuan;
      document.getElementById('setRatio').value = Math.round(s.max_deduct_ratio * 100);
    }

    async function saveSettings() {
      const msg = document.getElementById('setMsg');
      msg.className = 'msg ok';
      msg.textContent = '';
      const res = await api('admin/settings/save', {
        checkin_points: document.getElementById('setCheckin').value,
        points_per_yuan: document.getElementById('setPerYuan').value,
        max_deduct_ratio: document.getElementById('setRatio').value
      }, true);
      if (res.ok) {
        msg.textContent = '已保存';
        loadSettings();
      } else {
        msg.className = 'msg err';
        msg.textContent = res.msg || '保存失败';
      }
    }
    function hideRatePanel() {
      document.getElementById('list').style.display = '';
      document.getElementById('ratePanel').style.display = 'none';
    }

    function showDash(username) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      document.getElementById('who').textContent = username;
      loadTasks();
    }

    function filterTasks(tasks) {
      if (currentTab === 'review') return tasks.filter(t => t.status === 'pending_review');
      if (currentTab === 'recharge') return tasks.filter(t => t.status === 'recharge_pending');
      return tasks;
    }

    function renderStats(tasks) {
      const c = { pending_review: 0, recharge_pending: 0, completed: 0 };
      tasks.forEach(t => { if (c[t.status] !== undefined) c[t.status]++; });
      document.getElementById('stats').innerHTML =
        '<div class="stat"><div class="s-num warn">' + c.pending_review + '</div><div class="s-lbl">待一审</div></div>' +
        '<div class="stat"><div class="s-num brand">' + c.recharge_pending + '</div><div class="s-lbl">待二审</div></div>' +
        '<div class="stat"><div class="s-num ok">' + c.completed + '</div><div class="s-lbl">已完成</div></div>';
    }

    function renderTasks(tasks) {
      const box = document.getElementById('list');
      if (!tasks.length) { box.innerHTML = '<div class="empty">暂无相关任务</div>'; return; }
      box.innerHTML = tasks.map(t => {
        let actions = '';
        if (t.status === 'pending_review') {
          actions =
            '<button class="btn btn-green btn-sm" onclick="review(\'' + t.id + '\',\'approve\')">一审通过</button>' +
            '<button class="btn btn-red btn-sm" onclick="review(\'' + t.id + '\',\'reject\')">拒绝</button>';
        } else if (t.status === 'recharge_pending') {
          actions =
            '<button class="btn btn-green btn-sm" onclick="confirmR(\'' + t.id + '\',\'confirm\')">确认充值完成</button>' +
            '<button class="btn btn-red btn-sm" onclick="confirmR(\'' + t.id + '\',\'reject\')">拒绝</button>';
        }
        const note = t.progress_note ? '<div class="note">备注：' + escapeHtml(t.progress_note) + '</div>' : '';
        const imgs = Array.isArray(t.images) ? t.images : [];
        const imgHtml = imgs.length
          ? '<div class="thumbs">' + imgs.map(p => {
              const u = signedUrl(p);
              return u
                ? '<a class="thumb" href="' + escapeHtml(u) + '" target="_blank" rel="noopener"><img src="' + escapeHtml(u) + '" alt="" /></a>'
                : '<div class="thumb thumb-wait"></div>';
            }).join('') + '</div>'
          : '';
        const amountRow = '<div class="actions">' +
          '<input id="amt-' + t.id + '" type="number" min="0" class="num" placeholder="改金额（留空=待评估）" style="width:190px">' +
          '<button class="btn btn-ghost btn-sm" onclick="setAmount(\'' + t.id + '\')">保存金额</button></div>';
        const progInput = '<div class="actions">' +
          '<input id="pn-' + t.id + '" placeholder="填写进度备注…" style="flex:1; padding:9px 12px">' +
          '<button class="btn btn-ghost btn-sm" onclick="setProgress(\'' + t.id + '\')">保存备注</button></div>';
        return '<div class="task">' +
          '<div class="t-head">' + badge(t.status) + '<span class="t-meta">' + t.id + '</span></div>' +
          '<div class="t-type">' + escapeHtml(t.type) + '</div>' +
          (t.description ? '<div class="t-desc">' + escapeHtml(t.description) + '</div>' : '') +
          imgHtml +
          '<div class="t-meta">用户：' + t.uid + ' ｜ 联系方式：' + escapeHtml(t.contact || '—') + '</div>' +
          '<div class="t-meta">预估资金：' + moneyText(t.amount) + moneyExtra(t) + ' ｜ ' + fmtTime(t.created_at) + '</div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + (t.progress || 0) + '%"></div></div>' +
          note + amountRow + progInput +
          (actions ? '<div class="actions">' + actions + '</div>' : '') +
          '</div>';
      }).join('');
    }

    async function review(id, action) {
      if (action === 'reject' && !confirm('确认拒绝该任务？')) return;
      const res = await api('admin/review', { id, action }, true);
      if (res.ok) loadTasks(); else alert(res.msg || '操作失败');
    }
    async function confirmR(id, action) {
      if (action === 'reject' && !confirm('确认拒绝该任务？')) return;
      const res = await api('admin/confirm', { id, action }, true);
      if (res.ok) loadTasks(); else alert(res.msg || '操作失败');
    }
    async function setProgress(id) {
      const note = document.getElementById('pn-' + id).value.trim();
      const res = await api('admin/progress', { id, progressNote: note }, true);
      if (res.ok) loadTasks(); else alert(res.msg || '操作失败');
    }
    async function setAmount(id) {
      const raw = document.getElementById('amt-' + id).value.trim();
      const res = await api('admin/amount', { id, amount: raw === '' ? null : raw }, true);
      if (res.ok) loadTasks(); else alert(res.msg || '操作失败');
    }

    async function loadTasks() {
      const res = await api('admin/tasks', {}, true);
      if (res.ok) {
        renderStats(res.tasks);
        if (currentTab !== 'rates') {
          await ensureSigned(res.tasks);
          renderTasks(filterTasks(res.tasks));
        }
      } else {
        document.getElementById('list').innerHTML = '<div class="empty">加载失败，请重新登录</div>';
        token = ''; localStorage.removeItem('biz_admin_token');
      }
    }

    // ---------- 金额规则 ----------
    async function loadRates() {
      const box = document.getElementById('rateList');
      const res = await api('admin/rates', {}, true);
      if (!res.ok) { box.innerHTML = '<div class="empty">加载失败，请重新登录</div>'; return; }
      const rates = res.rates || [];
      if (!rates.length) {
        box.innerHTML = '<div class="empty">还没有规则，先在上面添加一条（例如「数据标注 → 200」）</div>';
        return;
      }
      box.innerHTML = rates.map(r =>
        '<div class="task"><div class="rate-row">' +
          '<input class="grow" id="kw-' + r.id + '" value="' + escapeHtml(r.keyword) + '" />' +
          '<input class="num" id="am-' + r.id + '" type="number" min="0" value="' + Number(r.amount) + '" />' +
          '<button class="btn btn-ghost btn-sm" onclick="saveRate(\'' + r.id + '\')">保存</button>' +
          '<button class="btn btn-red btn-sm" onclick="delRate(\'' + r.id + '\')">删除</button>' +
        '</div></div>'
      ).join('');
    }

    async function addRate() {
      const kw = document.getElementById('newKw').value.trim();
      const amt = document.getElementById('newAmt').value.trim();
      if (!kw) { alert('请填写关键词'); return; }
      if (amt === '') { alert('请填写金额'); return; }
      const res = await api('admin/rate/save', { keyword: kw, amount: amt }, true);
      if (res.ok) {
        document.getElementById('newKw').value = '';
        document.getElementById('newAmt').value = '';
        loadRates();
      } else alert(res.msg || '保存失败');
    }

    async function saveRate(id) {
      const kw = document.getElementById('kw-' + id).value.trim();
      const amt = document.getElementById('am-' + id).value.trim();
      const res = await api('admin/rate/save', { id, keyword: kw, amount: amt }, true);
      if (res.ok) loadRates(); else alert(res.msg || '保存失败');
    }

    async function delRate(id) {
      if (!confirm('确认删除这条规则？')) return;
      const res = await api('admin/rate/delete', { id }, true);
      if (res.ok) loadRates(); else alert(res.msg || '删除失败');
    }

    document.getElementById('addRateBtn').addEventListener('click', addRate);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
    document.getElementById('newAmt').addEventListener('keydown', e => { if (e.key === 'Enter') addRate(); });
    document.getElementById('newKw').addEventListener('keydown', e => { if (e.key === 'Enter') addRate(); });

    (async () => {
      if (!token) return;
      const res = await api('admin/tasks', {}, true);
      if (res.ok) showDash('管理员');
    })();

    setInterval(() => { if (token && document.getElementById('dash').style.display !== 'none') loadTasks(); }, 8000);
  </script>
</body>
</html>
